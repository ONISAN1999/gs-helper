name: update-data

on:
  schedule:
    - cron: "0 2 * * *"   # 09:00 เวลาไทยทุกวัน
  workflow_dispatch:       # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ดึงข้อมูลเซ็ต + คอมพ์
        run: python tools/fetch_data.py

      - name: commit ถ้ามีอะไรเปลี่ยน
        run: |
          git config user.name "gs-data-bot"
          git config user.email "actions@github.com"
          git add data
          git diff --staged --quiet || git commit -m "data: $(date -u +%Y-%m-%d)"
          git push
